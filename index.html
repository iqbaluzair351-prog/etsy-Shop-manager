<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etsy Shop Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ─── TERI ORIGINAL CSS (UNTOUCHED) ─── */
:root {
  --accent: #6C63FF;
  --accent-dark: #5A52D5;
  --accent-light: #EEF0FF;
  --accent-glow: rgba(108,99,255,0.18);
  --gold: #F5A623;
  --gold-light: #FFF8EC;
  --bg: #F0F2F8;
  --sidebar-bg: #1A1D2E;
  --sidebar-hover: rgba(255,255,255,0.07);
  --sidebar-active: rgba(108,99,255,0.22);
  --card: #FFFFFF;
  --card2: #F7F8FC;
  --text: #1A1D2E;
  --muted: #8B90A7;
  --border: rgba(0,0,0,0.06);
  --green: #16A34A;
  --green-bg: #DCFCE7;
  --amber: #B45309;
  --amber-bg: #FEF3C7;
  --blue: #1D4ED8;
  --blue-bg: #DBEAFE;
  --red: #DC2626;
  --red-bg: #FEE2E2;
  --purple: #7C3AED;
  --purple-bg: #EDE9FE;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 7px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.06);
  --shadow-card: 0 2px 8px rgba(26,29,46,0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
h1,h2,h3,h4,.brand-name,.stat-val,.page-title { font-family: 'Outfit', sans-serif; }
.shell { display: flex; min-height: 100vh; }
.sidebar { width: 252px; background: var(--sidebar-bg); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
.main { margin-left: 252px; padding: 2rem 2.25rem; flex: 1; }
.brand { padding: 1.5rem 1.4rem 1.2rem; display: flex; align-items: center; gap: 11px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.brand-logo { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), #9B8FFF); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.brand-name { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.2; letter-spacing: -0.2px; }
.brand-sub { font-size: 10.5px; color: rgba(255,255,255,0.4); margin-top: 1px; }
nav { padding: 1rem 0.8rem; flex: 1; overflow-y: auto; }
.nav-label { font-size: 9.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.3); padding: 0 8px; margin: 14px 0 5px; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: var(--radius-xs); cursor: pointer; font-size: 13.5px; color: rgba(255,255,255,0.55); font-weight: 400; transition: all 0.15s; margin-bottom: 1px; border: none; background: transparent; width: 100%; text-align: left; }
.nav-item:hover { background: var(--sidebar-hover); color: rgba(255,255,255,0.85); }
.nav-item.active { background: var(--sidebar-active); color: #fff; font-weight: 600; }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.badge-pill { margin-left: auto; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; font-family: 'Outfit', sans-serif; line-height: 1.4; }
.sidebar-footer { padding: 1rem 1.4rem; border-top: 1px solid rgba(255,255,255,0.07); font-size: 11px; color: rgba(255,255,255,0.3); display: flex; flex-direction: column; gap: 8px; }
.sidebar-footer a { color: rgba(108,99,255,0.9); text-decoration: none; font-weight: 500; }
.sync-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,0.35); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #22C55E; flex-shrink: 0; }
.sync-dot.syncing { background: var(--gold); animation: pulse 1.2s infinite; }
.sync-dot.error { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.tab-content { display: none; }
.tab-content.active { display: block; animation: slideIn 0.2s ease; }
@keyframes slideIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
.page-hd { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.75rem; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 1.75rem; }
.stat-card { background: var(--card); border-radius: var(--radius); padding: 1.3rem 1.4rem; box-shadow: var(--shadow-card); border: 1px solid var(--border); position: relative; overflow: hidden; }
.stat-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px; }
.stat-label { font-size: 11.5px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
.stat-val { font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: -0.5px; }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 5px; }
.section-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.9rem; }
.section-hd h2 { font-size: 14px; font-weight: 600; letter-spacing: -0.1px; color: var(--text); }
.card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-card); overflow: hidden; }
.card-pad { padding: 1.4rem; }
.greeting-card { background: linear-gradient(135deg, #1A1D2E 0%, #2D2F5E 100%); border-radius: var(--radius); padding: 1.6rem 1.8rem; margin-bottom: 1.75rem; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 24px rgba(26,29,46,0.2); }
.greeting-name { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
.greeting-desc { font-size: 12.5px; color: rgba(255,255,255,0.5); margin-top: 4px; }
.greeting-date { font-size: 12px; color: rgba(255,255,255,0.4); }
.greeting-badge { display: inline-block; margin-top: 6px; background: rgba(108,99,255,0.3); color: #BDB8FF; font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 99px; }
.remind-item { display: flex; align-items: flex-start; gap: 13px; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); transition: background 0.1s; }
.remind-item:hover { background: #FAFBFE; }
.remind-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
.step1 { background: var(--blue-bg); }
.step2 { background: var(--amber-bg); }
.step3 { background: var(--purple-bg); }
.btn { font-size: 12.5px; padding: 7px 14px; border-radius: var(--radius-xs); border: 1.5px solid var(--border); background: transparent; cursor: pointer; color: var(--text); font-family: 'Inter', sans-serif; font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; }
.btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-main { width: 100%; padding: 12px; margin-top: 10px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; }
.form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.form-group label { font-size: 12px; color: var(--muted); font-weight: 500; }
.form-group input, .form-group select { padding: 10px 13px; border: 1.5px solid #E2E4EF; border-radius: var(--radius-xs); font-size: 14px; outline: none; }
.form-group input:focus { border-color: var(--accent); }
.overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,30,0.5); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.overlay.open { display: flex; }
.modal { background: var(--card); border-radius: 20px; padding: 1.6rem; width: 92%; max-width: 480px; box-shadow: 0 24px 60px rgba(10,10,30,0.2); }
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1A1D2E; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity 0.3s; z-index: 999; }
.toast.show { opacity: 1; }
@media(max-width:768px){
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 1rem; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">🛍️</div>
      <div>
        <div class="brand-name">Etsy Shop Manager</div>
        <div class="brand-sub">Follow-up & Analytics</div>
      </div>
    </div>
    <nav>
      <div class="nav-label">Overview</div>
      <button class="nav-item active" onclick="gotoTab('dashboard')">Dashboard</button>
      <button class="nav-item" onclick="gotoTab('reminders')">Reminders <span class="badge-pill" id="reminderBadge">0</span></button>
      <button class="nav-item" onclick="gotoTab('add')">Add Customer</button>
      <button class="nav-item" onclick="gotoTab('customers')">All Customers</button>
      <button class="nav-item" onclick="gotoTab('products')">My Products</button>
    </nav>
    <div class="sidebar-footer">
      <div class="sync-status">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncStatusText">Syncing...</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="tab-content active" id="tab-dashboard">
      <div class="greeting-card">
        <div>
          <div class="greeting-name" id="greetingText">Good morning! 👋</div>
          <div class="greeting-desc">Here's your shop status.</div>
        </div>
        <div style="text-align:right">
          <div class="greeting-date" id="todayDate"></div>
          <div class="greeting-badge" id="greetingBadge">0 reminders</div>
        </div>
      </div>
      <div class="stats-grid" id="dashStats"></div>
      <div class="section-hd"><h2>Today's Reminders</h2></div>
      <div class="card"><div id="dashReminders"></div></div>
    </div>

    <div class="tab-content" id="tab-add">
      <div class="page-hd"><div><div class="page-title">Add Customer ➕</div></div></div>
      <div class="card card-pad" style="max-width:600px">
        <div class="form-group"><label>Customer Name</label><input type="text" id="fName"></div>
        <div class="form-group"><label>Product</label><select id="fProduct"></select></div>
        <div class="form-group"><label>Date</label><input type="date" id="fDate"></div>
        <div class="form-group"><label>Price ($)</label><input type="number" id="fPrice"></div>
        <button class="btn-main" onclick="addCustomer()">Add to Database</button>
      </div>
    </div>

    <div class="tab-content" id="tab-customers">
      <div class="page-hd"><div><div class="page-title">All Customers 👥</div></div></div>
      <div class="card"><div id="custList"></div></div>
    </div>

    <div class="tab-content" id="tab-products">
      <div class="page-hd">
        <div><div class="page-title">My Products 🛒</div></div>
        <button class="btn accent" onclick="openAddProduct()">+ Add Product</button>
      </div>
      <div id="prodGrid" style="display:grid; grid-template-columns: 1fr 1fr; gap:15px"></div>
    </div>
  </main>
</div>

<div class="overlay" id="addProdOverlay">
  <div class="modal">
    <h3>Add Product</h3>
    <div class="form-group"><label>Name</label><input type="text" id="pName"></div>
    <div class="form-group"><label>Price ($)</label><input type="number" id="pSalePrice"></div>
    <div style="display:flex; gap:10px; margin-top:20px">
        <button class="btn accent" style="flex:1" onclick="saveNewProduct()">Save</button>
        <button class="btn" style="flex:1" onclick="closeProdModalDirect()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── SUPABASE SETTINGS ──────────────────────────────────────────────────
const SUPABASE_URL = 'https://ahrthihtkczxymzpcwly.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocnRoaWh0a2N6eHltenBjd2x5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MjA1MzMsImV4cCI6MjA5NDM5NjUzM30.hgcRZ0d4E0dl_0BpFwzVoviHuBURsmyFmp3-KGR69uA';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let customers = [];
let products = [];

// ─── SYNC DATA ─────────────────────────────────────────────────────────
async function initDB() {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncStatusText');
  dot.classList.add('syncing');
  
  try {
    const { data: pData } = await _supabase.from('products').select('*');
    if (pData) products = pData;

    const { data: cData } = await _supabase.from('customers').select('*').order('created_at', { ascending: false });
    if (cData) customers = cData;

    renderAll();
    txt.innerText = "Cloud Synced";
    dot.classList.remove('syncing');
    dot.style.background = "#22C55E";
  } catch (e) {
    txt.innerText = "Error Connecting";
  }
}

// ─── ADD CUSTOMER ──────────────────────────────────────────────────────
async function addCustomer() {
  const name = document.getElementById('fName').value;
  const prod = document.getElementById('fProduct').value;
  const date = document.getElementById('fDate').value;
  const price = document.getElementById('fPrice').value;

  if(!name || !prod) return showToast("Name and Product are required!");

  const newObj = { name, product: prod, purchase_date: date, price: parseFloat(price)||0 };
  
  showToast("Saving...");
  const { data, error } = await _supabase.from('customers').insert([newObj]).select();
  
  if(!error) {
    customers.unshift(data[0]);
    renderAll();
    showToast("Saved! ✅");
    gotoTab('dashboard');
  }
}

// ─── ADD PRODUCT ───────────────────────────────────────────────────────
async function saveNewProduct() {
  const name = document.getElementById('pName').value;
  const price = document.getElementById('pSalePrice').value;

  const { data, error } = await _supabase.from('products').insert([{ name, price: parseFloat(price) }]).select();
  if(!error) {
    products.push(data[0]);
    renderAll();
    closeProdModalDirect();
    showToast("Product Added!");
  }
}

// ─── UI HELPERS ────────────────────────────────────────────────────────
function renderAll() {
  // Update Dropdown
  const sel = document.getElementById('fProduct');
  sel.innerHTML = products.map(p => `<option value="${p.name}">${p.name}</option>`).join('');

  // Update Stats
  const totalRev = customers.reduce((s, c) => s + (c.price || 0), 0);
  document.getElementById('dashStats').innerHTML = `
    <div class="stat-card">Total Revenue <div class="stat-val">$${totalRev.toFixed(2)}</div></div>
    <div class="stat-card">Customers <div class="stat-val">${customers.length}</div></div>
  `;

  // Update Customer List
  document.getElementById('custList').innerHTML = customers.map(c => `
    <div style="padding:15px; border-bottom:1px solid #eee">
        <b>${c.name}</b> - ${c.product} ($${c.price})
    </div>
  `).join('');

  // Update Products
  document.getElementById('prodGrid').innerHTML = products.map(p => `
    <div class="stat-card">${p.name} <div class="stat-val">$${p.price}</div></div>
  `).join('');
}

function gotoTab(id) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
}

function openAddProduct() { document.getElementById('addProdOverlay').classList.add('open'); }
function closeProdModalDirect() { document.getElementById('addProdOverlay').classList.remove('open'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function initGreeting() {
    const hr = new Date().getHours();
    document.getElementById('greetingText').innerText = hr < 12 ? "Good Morning! 👋" : hr < 18 ? "Good Afternoon! ☀️" : "Good Evening! 🌙";
    document.getElementById('todayDate').innerText = new Date().toLocaleDateString();
}

initGreeting();
initDB();
</script>
</body>
</html>
