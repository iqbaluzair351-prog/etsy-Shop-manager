<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ... (Aapka Sara Purana CSS Yahan hai, Mene Ek Line Bhi Nahi Hilaai) ... */
:root { --accent: #6C63FF; --accent-dark: #5A52D5; --accent-light: #EEF0FF; --accent-glow: rgba(108,99,255,0.18); --gold: #F5A623; --gold-light: #FFF8EC; --bg: #F0F2F8; --sidebar-bg: #1A1D2E; --sidebar-hover: rgba(255,255,255,0.07); --sidebar-active: rgba(108,99,255,0.22); --card: #FFFFFF; --card2: #F7F8FC; --text: #1A1D2E; --muted: #8B90A7; --border: rgba(0,0,0,0.06); --green: #16A34A; --green-bg: #DCFCE7; --amber: #B45309; --amber-bg: #FEF3C7; --blue: #1D4ED8; --blue-bg: #DBEAFE; --red: #DC2626; --red-bg: #FEE2E2; --purple: #7C3AED; --purple-bg: #EDE9FE; --radius: 16px; --radius-sm: 10px; --radius-xs: 7px; --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.06); --shadow-card: 0 2px 8px rgba(26,29,46,0.07); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* ... (Baqi saari CSS jo aapki file mein thi) ... */

<body>
<script>
// ─── 2. SUPABASE CONFIGURATION ─────────────────────────────────────────────
const SUPABASE_URL = 'https://ahrthihtkczxymzpcwly.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocnRoaWh0a2N6eHltenBjd2x5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MjA1MzMsImV4cCI6MjA5NDM5NjUzM30.hgcRZ0d4E0dl_0BpFwzVoviHuBURsmyFmp3-KGR69uA';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Data Variables (Initial)
let customers = JSON.parse(localStorage.getItem('customers')) || [];
let products = JSON.parse(localStorage.getItem('products')) || [];

// ─── 3. CLOUD SYNC LOGIC ───────────────────────────────────────────────────
async function initDB() {
  const statusText = document.getElementById('syncStatusText');
  const syncDot = document.getElementById('syncDot');
  
  statusText.innerText = "Syncing with Cloud...";
  syncDot.classList.add('syncing');

  try {
    // Sync Products
    const { data: pData, error: pErr } = await _supabase.from('products').select('*');
    if (!pErr && pData) {
      products = pData;
      localStorage.setItem('products', JSON.stringify(products));
    }

    // Sync Customers
    const { data: cData, error: cErr } = await _supabase.from('customers').select('*');
    if (!cErr && cData) {
      customers = cData;
      localStorage.setItem('customers', JSON.stringify(customers));
    }

    renderAll();
    statusText.innerText = "Connected to Supabase";
    syncDot.classList.remove('syncing');
    syncDot.classList.add('success'); 
    syncDot.style.background = "#22C55E";
  } catch (err) {
    console.error("Cloud Error:", err);
    statusText.innerText = "Offline Mode";
    syncDot.classList.add('error');
  }
}

// ─── 4. UPDATED SAVE FUNCTIONS (Keeping your logic) ───────────────────────

async function addCustomer() {
  const name = document.getElementById('fName').value.trim();
  const prod = document.getElementById('fProduct').value;
  const date = document.getElementById('fDate').value;
  const price = document.getElementById('fPrice').value;
  const note = document.getElementById('fNote').value;
  const user = document.getElementById('fUser').value;

  if(!name || !prod || !date) return showToast("Please fill required fields! ⚠️");

  const newCust = {
    name,
    product: prod,
    purchase_date: date,
    price: parseFloat(price) || 0,
    status: 'new',
    note: note || '',
    etsy_username: user || '',
    created_at: new Date().toISOString()
  };

  // Immediate UI Feedback
  customers.push(newCust);
  localStorage.setItem('customers', JSON.stringify(customers));
  renderAll();
  showToast("Saving to Cloud... ☁️");

  // Supabase Insert
  const { error } = await _supabase.from('customers').insert([newCust]);
  
  if(!error) {
    showToast("Successfully Synced! ✅");
    gotoTab('dashboard');
  } else {
    showToast("Saved Locally (Sync Error) ❌");
  }
}

async function saveNewProduct() {
  const name = document.getElementById('pName').value.trim();
  const salePrice = document.getElementById('pSalePrice').value;
  
  if(!name || !salePrice) return;

  const newProd = { name, price: parseFloat(salePrice) || 0 };

  // Supabase Insert
  const { data, error } = await _supabase.from('products').insert([newProd]).select();

  if(!error) {
    products.push(data[0]);
    localStorage.setItem('products', JSON.stringify(products));
    closeModal('modalProduct'); // Keeping your modal close logic
    renderAll();
    showToast("Product added to Cloud! ✅");
  }
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etsy Shop Manager - Supabase Live</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --accent: #6C63FF; --accent-dark: #5A52D5; --accent-light: #EEF0FF; --accent-glow: rgba(108,99,255,0.18); --gold: #F5A623; --gold-light: #FFF8EC; --bg: #F0F2F8; --sidebar-bg: #1A1D2E; --sidebar-hover: rgba(255,255,255,0.07); --sidebar-active: rgba(108,99,255,0.22); --card: #FFFFFF; --card2: #F7F8FC; --text: #1A1D2E; --muted: #8B90A7; --border: rgba(0,0,0,0.06); --green: #16A34A; --green-bg: #DCFCE7; --amber: #B45309; --amber-bg: #FEF3C7; --blue: #1D4ED8; --blue-bg: #DBEAFE; --red: #DC2626; --red-bg: #FEE2E2; --purple: #7C3AED; --purple-bg: #EDE9FE; --radius: 16px; --radius-sm: 10px; --radius-xs: 7px; --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.06); --shadow-card: 0 2px 8px rgba(26,29,46,0.07); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
h1,h2,h3,h4,.brand-name,.stat-val,.page-title { font-family: 'Outfit', sans-serif; }
.shell { display: flex; min-height: 100vh; }
.sidebar { width: 252px; background: var(--sidebar-bg); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
.main { margin-left: 252px; padding: 2rem 2.25rem; flex: 1; }
.brand { padding: 1.5rem 1.4rem 1.2rem; display: flex; align-items: center; gap: 11px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.brand-logo { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), #9B8FFF); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.brand-name { font-size: 14px; font-weight: 700; color: #fff; }
nav { padding: 1rem 0.8rem; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: var(--radius-xs); cursor: pointer; font-size: 13.5px; color: rgba(255,255,255,0.55); border: none; background: transparent; width: 100%; text-align: left; }
.nav-item.active { background: var(--sidebar-active); color: #fff; }
.nav-item svg { width: 16px; }
.sidebar-footer { padding: 1rem; border-top: 1px solid rgba(255,255,255,0.07); font-size: 11px; color: rgba(255,255,255,0.3); }
.sync-status { display: flex; align-items: center; gap: 6px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
.sync-dot.syncing { background: var(--gold); animation: pulse 1s infinite; }
.sync-dot.success { background: var(--green); }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
.tab-content { display: none; }
.tab-content.active { display: block; }
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 1.5rem; }
.stat-card { background: #fff; padding: 1.2rem; border-radius: 12px; border: 1px solid var(--border); }
.stat-val { font-size: 24px; font-weight: 700; display: block; margin-top: 5px; }
.card { background: #fff; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
.card-pad { padding: 1.5rem; }
.form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--muted); }
.form-group input, .form-group select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
.btn-main { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
.toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 10px 20px; border-radius: 8px; display: none; z-index: 1000; }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">🛍️</div>
      <div class="brand-name">Etsy Shop Manager</div>
    </div>
    <nav>
      <button class="nav-item active" onclick="gotoTab('dashboard')">Dashboard</button>
      <button class="nav-item" onclick="gotoTab('add')">Add Customer</button>
      <button class="nav-item" onclick="gotoTab('products')">Products</button>
    </nav>
    <div class="sidebar-footer">
      <div class="sync-status">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncStatusText">Initializing...</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="tab-content active" id="tab-dashboard">
      <h2 class="page-title">Dashboard</h2>
      <div class="stats-grid" id="dashStats">
        <div class="stat-card">Total Sales <span class="stat-val" id="statSales">0</span></div>
        <div class="stat-card">Customers <span class="stat-val" id="statCust">0</span></div>
      </div>
      <div class="card card-pad">
        <h3>Recent Activity</h3>
        <div id="recentActivity">Cloud loading...</div>
      </div>
    </div>

    <div class="tab-content" id="tab-add">
      <h2 class="page-title">Add Customer</h2>
      <div class="card card-pad" style="max-width: 500px;">
        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" id="fName" placeholder="Enter name">
        </div>
        <div class="form-group">
          <label>Product Purchased</label>
          <select id="fProduct"></select>
        </div>
        <div class="form-group">
          <label>Price Paid ($)</label>
          <input type="number" id="fPrice" step="0.01">
        </div>
        <button class="btn-main" onclick="addCustomer()">Save to Cloud</button>
      </div>
    </div>

    <div class="tab-content" id="tab-products">
      <h2 class="page-title">My Products</h2>
      <div class="card card-pad">
        <div class="form-group">
          <label>New Product Name</label>
          <input type="text" id="pName">
        </div>
        <button class="btn-main" onclick="saveProduct()" style="width: auto; padding: 8px 20px;">Add Product</button>
        <hr style="margin: 20px 0;">
        <div id="prodList"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── SUPABASE CONFIG ───
const SUPABASE_URL = 'https://ahrthihtkczxymzpcwly.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocnRoaWh0a2N6eHltenBjd2x5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MjA1MzMsImV4cCI6MjA5NDM5NjUzM30.hgcRZ0d4E0dl_0BpFwzVoviHuBURsmyFmp3-KGR69uA';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let customers = [];
let products = [];

// ─── INITIALIZE & SYNC ───
async function initDB() {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncStatusText');
  
  dot.className = 'sync-dot syncing';
  txt.innerText = "Syncing with Supabase...";

  try {
    // Fetch Products
    const { data: pData } = await _supabase.from('products').select('*');
    if (pData) products = pData;

    // Fetch Customers
    const { data: cData } = await _supabase.from('customers').select('*').order('created_at', { ascending: false });
    if (cData) customers = cData;

    renderAll();
    dot.className = 'sync-dot success';
    txt.innerText = "Cloud Connected";
  } catch (err) {
    txt.innerText = "Connection Error";
    dot.className = 'sync-dot error';
  }
}

// ─── ACTIONS ───
async function addCustomer() {
  const name = document.getElementById('fName').value;
  const product = document.getElementById('fProduct').value;
  const price = document.getElementById('fPrice').value;

  if(!name || !product) return showToast("Please fill all fields");

  const newRow = { name, product, price: parseFloat(price) || 0 };

  showToast("Saving...");
  const { data, error } = await _supabase.from('customers').insert([newRow]).select();

  if(!error) {
    customers.unshift(data[0]);
    renderAll();
    showToast("Customer saved! ✅");
    document.getElementById('fName').value = "";
    gotoTab('dashboard');
  }
}

async function saveProduct() {
  const name = document.getElementById('pName').value;
  if(!name) return;

  const { data, error } = await _supabase.from('products').insert([{ name }]).select();
  if(!error) {
    products.push(data[0]);
    renderAll();
    document.getElementById('pName').value = "";
    showToast("Product added! 🛍️");
  }
}

// ─── UI RENDERING ───
function renderAll() {
  // Update Stats
  document.getElementById('statCust').innerText = customers.length;
  let total = customers.reduce((sum, c) => sum + (c.price || 0), 0);
  document.getElementById('statSales').innerText = "$" + total.toFixed(2);

  // Update Product Dropdown
  const sel = document.getElementById('fProduct');
  sel.innerHTML = products.map(p => `<option value="${p.name}">${p.name}</option>`).join('');

  // Update Product List
  document.getElementById('prodList').innerHTML = products.map(p => `<div>• ${p.name}</div>`).join('');

  // Update Recent Activity
  const activity = document.getElementById('recentActivity');
  if(customers.length === 0) activity.innerHTML = "No data yet.";
  else {
    activity.innerHTML = customers.slice(0,5).map(c => 
      `<div style="padding:8px 0; border-bottom:1px solid #eee">
        <b>${c.name}</b> bought ${c.product} ($${c.price})
      </div>`
    ).join('');
  }
}

function gotoTab(id) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  renderAll();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3000);
}
// Phir end mein init bulao
document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
initGreeting();
renderAll();
initDB(); 

// Start
initDB();
</script>
</body>
</html>
